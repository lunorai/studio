name: deploy-studio

on:
  workflow_run:
    workflows: ['build-and-push']
    types: [completed]

jobs:
  notify_build:
    name: Notify build status to Discord (STUDIO)
    runs-on: ubuntu-latest
    steps:
      - name: Compute vars
        id: vars
        shell: bash
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ "$BRANCH" = "main" ]; then ENV_TAG="PROD"; EMOJI="🟢";
          elif [ "$BRANCH" = "feat" ]; then ENV_TAG="FEAT"; EMOJI="🔵";
          elif [ "$BRANCH" = "dev" ]; then ENV_TAG="DEV"; EMOJI="🟡";
          else ENV_TAG="OTHER"; EMOJI="⚪";
          fi
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "env_tag=$ENV_TAG" >> $GITHUB_OUTPUT
          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
          echo "short_sha=${SHA::7}" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "conclusion=${{ github.event.workflow_run.conclusion }}" >> $GITHUB_OUTPUT
          echo "build_url=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT
          echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "actor=${{ github.event.workflow_run.actor.login }}" >> $GITHUB_OUTPUT

      - name: Send Discord (BUILD - STUDIO)
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: '[STUDIO][BUILD][${{ steps.vars.outputs.env_tag }}]'
          EMOJI: ${{ steps.vars.outputs.emoji }}
          STATUS: ${{ steps.vars.outputs.conclusion }}
          REPO: ${{ steps.vars.outputs.repo }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          SHA: ${{ steps.vars.outputs.short_sha }}
          ACTOR: ${{ steps.vars.outputs.actor }}
          URL: ${{ steps.vars.outputs.build_url }}
        run: |
          MSG="$TAG $EMOJI **$STATUS**
          repo: \`$REPO\`
          branch: \`$BRANCH\`
          commit: \`$SHA\`
          by: \`$ACTOR\`
          build: $URL"s

          curl -X POST \
              -H "Content-Type: application/json" \
              -d "$(echo "$MSG" | jq -R -s '{content: .}')" \
              "$WEBHOOK" \
              --fail --show-error

          if [ $? -eq 0 ]; then
            echo "Discord notification sent successfully"
          else
            echo "Failed to send Discord notification"
            exit 1
          fi

  prod:
    name: Deploy PROD (STUDIO)
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Notify (deploy start - PROD - STUDIO)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="[STUDIO][DEPLOY][PROD] 🚀 **started**"$'\n'"run: $URL"

          curl -X POST \
              -H "Content-Type: application/json" \
              -d "$(echo "$MSG" | jq -R -s '{content: .}')" \
              "$WEBHOOK" \
              --fail --show-error

          if [ $? -eq 0 ]; then
            echo "Discord notification sent successfully"
          else
            echo "Failed to send Discord notification"
            exit 1
          fi

      - name: Deploy via SSH (PROD - STUDIO)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /studio
            docker compose pull studio_prod
            docker compose up -d studio_prod
            docker compose ps

      - name: Notify (deploy result - PROD - STUDIO)
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ICON="✅"
          [ "$STATUS" = "success" ] || ICON="❌"
          MSG="[STUDIO][DEPLOY][PROD] $ICON **$STATUS**"$'\n'"run: $URL"

          curl -X POST \
              -H "Content-Type: application/json" \
              -d "$(echo "$MSG" | jq -R -s '{content: .}')" \
              "$WEBHOOK" \
              --fail --show-error

          if [ $? -eq 0 ]; then
            echo "Discord notification sent successfully"
          else
            echo "Failed to send Discord notification"
            exit 1
          fi

  feat:
    name: Deploy FEAT (STUDIO)
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.head_branch == 'feat' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Notify (deploy start - FEAT - STUDIO)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="[STUDIO][DEPLOY][FEAT] 🚀 **started**"$'\n'"run: $URL"

          curl -X POST \
              -H "Content-Type: application/json" \
              -d "$(echo "$MSG" | jq -R -s '{content: .}')" \
              "$WEBHOOK" \
              --fail --show-error

          if [ $? -eq 0 ]; then
            echo "Discord notification sent successfully"
          else
            echo "Failed to send Discord notification"
            exit 1
          fi

      - name: Deploy via SSH (FEAT - STUDIO)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            docker logout ghcr.io || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd /studio
            # make sure your compose image is ghcr.io/<owner>/<repo>:dev
            docker compose pull studio_dev
            docker compose up -d studio_dev
            docker compose ps

      - name: Notify (deploy result - FEAT - STUDIO)
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ICON="✅"
          [ "$STATUS" = "success" ] || ICON="❌"
          MSG="[STUDIO][DEPLOY][FEAT] $ICON **$STATUS**"$'\n'"run: $URL"

          curl -X POST \
              -H "Content-Type: application/json" \
              -d "$(echo "$MSG" | jq -R -s '{content: .}')" \
              "$WEBHOOK" \
              --fail --show-error

          if [ $? -eq 0 ]; then
            echo "Discord notification sent successfully"
          else
            echo "Failed to send Discord notification"
            exit 1
          fi

  dev:
    name: Deploy DEV (STUDIO)
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Notify (deploy start - DEV - STUDIO)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="[STUDIO][DEPLOY][DEV] 🚀 **started**"$'\n'"run: $URL"

          curl -X POST \
              -H "Content-Type: application/json" \
              -d "$(echo "$MSG" | jq -R -s '{content: .}')" \
              "$WEBHOOK" \
              --fail --show-error

          if [ $? -eq 0 ]; then
            echo "Discord notification sent successfully"
          else
            echo "Failed to send Discord notification"
            exit 1
          fi

      - name: Deploy via SSH (DEV - STUDIO)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            docker logout ghcr.io || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd /studio
            # make sure your compose image is ghcr.io/<owner>/<repo>:dev
            docker compose pull studio_dev
            docker compose up -d studio_dev
            docker compose ps

      - name: Notify (deploy result - DEV - STUDIO)
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ICON="✅"
          [ "$STATUS" = "success" ] || ICON="❌"
          MSG="[STUDIO][DEPLOY][DEV] $ICON **$STATUS**"$'\n'"run: $URL"

          curl -X POST \
              -H "Content-Type: application/json" \
              -d "$(echo "$MSG" | jq -R -s '{content: .}')" \
              "$WEBHOOK" \
              --fail --show-error

          if [ $? -eq 0 ]; then
            echo "Discord notification sent successfully"
          else
            echo "Failed to send Discord notification"
            exit 1
          fi



