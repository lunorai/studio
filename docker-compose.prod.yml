# Production Compose File - Deploy independently
version: "3.9"

services:
  # ==================================================
  # PUBLIC REVERSE PROXY (ONLY SERVICE USING 80 / 443)
  # ==================================================
  proxy:
    image: nginx:alpine
    container_name: studio_proxy_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/default.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/certs:ro
    depends_on:
      - app
    networks:
      - studio-prod

  # =====================
  # PROD – APP
  # =====================
  app:
    stdin_open: true
    tty: true
    build: .
    image: ghcr.io/lunorai/studio:main
    container_name: studio_app_prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DJANGO_DB: ${DJANGO_DB}
      POSTGRE_NAME: postgres
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: ${POSTGRE_PASSWORD}
      POSTGRE_PORT: ${POSTGRE_PORT}
      POSTGRE_HOST: ${POSTGRE_HOST}
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST}
      LUNOR_JWT_SECRET: ${LUNOR_JWT_SECRET}
      JSON_LOG: 1
      GRAPHQL_ENDPOINT: ${GRAPHQL_ENDPOINT}
      LUNOR_QUEST_URL: ${LUNOR_QUEST_URL}
    volumes:
      - ./mydata:/label-studio/data:rw
    command: label-studio-uwsgi
    networks:
      - studio-prod

networks:
  studio-prod:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.0.0/16
        - subnet: 2001:db8:1::/32
