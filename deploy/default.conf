worker_processes auto;
pid /tmp/nginx.pid;

# Optimized for high server load
events {
  worker_connections 16384;
  use epoll;
  multi_accept on;
}

http {
  ##
  # Temp folders
  ##
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  ##
  # Basic Settings
  ##
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  types_hash_max_size 2048;
  server_tokens off;
  client_header_buffer_size 16k;
  large_client_header_buffers 4 32k;

  client_max_body_size 100M;                 # 🔹 ADDED (fix 413 upload issue)

  ##
  # Connection Settings
  ##
  keepalive_timeout 65;
  keepalive_requests 100;
  reset_timedout_connection on;
  client_body_timeout 30;
  client_header_timeout 30;

  ##
  # Rate Limiting
  ##
  limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  ##
  # Upstreams (FIXED)
  ##
  upstream dev_backend {
    server studio_app_dev:8000;
    keepalive 32;
  }

  upstream prod_backend {
    server studio_app_prod:8000;
    keepalive 32;
  }

  ##
  # Logging
  ##
  map $msec $msec_no_decimal { ~(.*)\.(.*) $1$2; }

  log_format json_detailed escape=json
  '{'
    '"timestamp":"$msec_no_decimal",'
    '"http":{'
      '"method":"$request_method",'
      '"request_id":"$request_id",'
      '"status_code":$status,'
      '"content_type":"$content_type",'
      '"useragent":"$http_user_agent",'
      '"referrer":"$http_referer",'
      '"origin":"$http_origin",'
      '"x_forwarded_for":"$http_x_forwarded_for",'
      '"url":"$request_uri",'
      '"version":"$server_protocol",'
      '"connection":"$connection",'
      '"connection_requests":"$connection_requests"'
    '},'
    '"network":{'
      '"bytes_written":$bytes_sent,'
      '"bytes_read":$request_length,'
      '"client":{'
        '"ip":"$remote_addr",'
        '"port":$remote_port'
      '},'
      '"destination":{'
        '"ip":"$server_addr",'
        '"port":$server_port'
      '},'
      '"nginx":{'
        '"request_time":"$request_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_header_time":"$upstream_header_time"'
      '}'
    '}'
  '}';

  access_log /dev/stdout json_detailed;
  error_log /dev/stderr info;

  ##
  # MIME
  ##
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ##
  # SSL
  ##
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  ##
  # Gzip
  ##
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/rss+xml
    application/atom+xml
    image/svg+xml;

  ##
  # Proxy buffering
  ##
  proxy_buffering on;
  proxy_buffer_size 4k;
  proxy_buffers 8 4k;
  proxy_busy_buffers_size 8k;
  proxy_max_temp_file_size 2048m;
  proxy_temp_file_write_size 32k;


  # ======================
  # HTTP → HTTPS Redirect
  # ======================
  server {
    listen 80;
    server_name stdev.lunor.ai studio.lunor.ai;
    return 301 https://$host$request_uri;
  }

  # ======================
  # DEV – HTTPS
  # ======================
  server {
    listen 443 ssl;
    server_name stdev.lunor.ai;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/cert.key;

    # 🔹 EXPORT ENDPOINTS (Long-running)
    location ~ ^/api/[^/]+/export {
      client_max_body_size 100M;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 10;
      proxy_read_timeout 7200;              # 2 hours for export
      proxy_send_timeout 7200;              # 2 hours for export
      proxy_http_version 1.1;
      proxy_set_header Connection "";       # Enable keepalive

      proxy_pass http://dev_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔹 DEFAULT LOCATIONS
    location / {
      client_max_body_size 100M;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 10;
      proxy_read_timeout 3600;
      proxy_send_timeout 3600;
      proxy_http_version 1.1;
      proxy_set_header Connection "";       # Enable keepalive

      proxy_pass http://dev_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ======================
  # PROD – HTTPS
  # ======================
  server {
    listen 443 ssl;
    server_name studio.lunor.ai;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/cert.key;

    # 🔹 EXPORT ENDPOINTS (Long-running)
    location ~ ^/api/[^/]+/export {
      client_max_body_size 100M;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 10;
      proxy_read_timeout 7200;              # 2 hours for export
      proxy_send_timeout 7200;              # 2 hours for export
      proxy_http_version 1.1;
      proxy_set_header Connection "";       # Enable keepalive

      proxy_pass http://prod_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔹 DEFAULT LOCATIONS
    location / {
      client_max_body_size 100M;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 10;
      proxy_read_timeout 3600;
      proxy_send_timeout 3600;
      proxy_http_version 1.1;
      proxy_set_header Connection "";       # Enable keepalive

      proxy_pass http://prod_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
